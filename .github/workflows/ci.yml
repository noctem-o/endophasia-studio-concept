name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, class audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Shipped dependencies only. The devDependency advisories (braces/chokidar via Tailwind 3's build-time tooling) never reach the bundle; clearing them needs the Tailwind 4 migration, which is out of scope.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails if a colour/shadow utility used in src/ generated no CSS (Tailwind drops unknown classes silently). Needs the build.
      - run: npm run audit:classes

  e2e:
    name: Browser smoke (Playwright, Chromium, DPR 1 and 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # WebGL2 runs on Chromium's software rasteriser (SwiftShader). That tests correctness, never hardware performance. If WebGL2
      # cannot initialise the job FAILS rather than skipping the WebGL tests, so a silent loss of coverage cannot pass.
      E2E_REQUIRE_WEBGL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 7
